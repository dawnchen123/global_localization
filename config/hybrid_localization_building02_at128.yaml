# Building02-specific AT128 visual frontend overlay.
#
# LiDAR, IMU and Ranger parameters deliberately inherit the validated Hesai
# profile. A 400 s A/B run showed that the previous dense-map/compatible-plane
# overrides increased APE RMSE from 0.767 m to 1.423 m and yaw RMSE from
# 0.687 deg to 1.248 deg. Keep only the independently gated visual limits here.

lidar_odometry:
  # Building02 spans more than the old 70 m sliding submap. Preserve original
  # geometry for the return traversal, matching the non-sliding i2Nav mode in
  # FAST-LIVO2. The cap is above the measured full-run demand while remaining
  # a hard guard against unbounded memory use.
  retain_global_map: true
  local_map_radius: 500.0
  max_map_points: 3000000

  # A point-to-plane scan can constrain translation while leaving a turn axis
  # weak. Marginalize translation, retain only 10% LiDAR information in weak
  # rotational modes, and keep such scans out of the persistent map unless
  # yaw has independent geometric support. IMU/wheel propagation still carries
  # the physical turn, so this does not impose a zero-yaw assumption.
  rotation_observability_eigen_ratio: 0.001
  project_lidar_information_to_observable_rotation: true
  weak_rotation_information_scale: 0.10
  map_insertion_min_observable_rotation_directions: 2
  map_insertion_min_yaw_observability: 0.25

  # FAST-LIVO2's i2Nav profile injects acc/gyr covariance 0.01 with dt^2 at
  # 200 Hz. This filter uses continuous densities (sigma^2 * dt), hence
  # sigma=sqrt(0.01/200)=0.007071. The old acceleration sigma=0.10 made the
  # velocity prior two orders of magnitude too loose and allowed LiDAR/map
  # differences to pull gravity and accelerometer bias apart after long turns.
  gyro_noise: 0.007071
  acceleration_noise: 0.007071
  imu_init_duration: 5.0
  imu_init_samples: 900
  imu_init_use_mean_covariance: true
  lidar_update_gravity: false
  max_lidar_velocity_step: 0.20
  max_lidar_gyro_bias_step: 0.00002
  lidar_acceleration_bias_require_stable_wheel_motion: false
  max_lidar_acceleration_bias_step: 0.005

  # Keep the first validated surface as the long-term reference and add map
  # keyframes by motion/timeout. Residual and correction gates remain active;
  # A complete replay showed that non-converged scans around the 1588 s turn
  # formed a self-consistent wrong map. Require confirmed rematching before a
  # keyframe can change the persistent reference.
  freeze_mature_voxels: true
  map_insertion_require_convergence: true
  map_insertion_min_translation: 0.15
  map_insertion_min_rotation_deg: 0.5
  map_insertion_max_interval: 0.5

  # IMU propagation carries the real turn. LiDAR is allowed only a small
  # correction relative to that prediction. Full-run diagnostics showed that
  # normal 20 s cumulative corrections stay below 0.74 deg, while the failing
  # turn reaches 0.92--3.52 deg. Clamp only that yaw component at 0.9 deg;
  # retain LiDAR translation/roll/pitch and keep limited scans out of the map.
  # Estimate gyro Z bias only from a robust low-curvature Ranger window.
  turn_aware_lidar_correction_rotation_deg: 0.0
  max_lidar_correction_rotation_deg: 0.75
  recovery_max_lidar_correction_rotation_deg: 1.0
  lidar_rotation_correction_nis_gate: 9.0
  lidar_rotation_correction_std_floor_deg: 0.10
  lidar_yaw_correction_window_sec: 20.0
  max_cumulative_lidar_yaw_correction_deg: 0.9
  limit_cumulative_lidar_yaw_correction: true
  limited_lidar_yaw_information_scale: 0.02
  defer_map_when_lidar_yaw_limited: true
  wheel_yaw_rate_fuse_gyro_bias: true
  wheel_yaw_bias_window_sec: 3.0
  wheel_yaw_bias_min_samples: 12
  wheel_yaw_bias_max_abs_rate: 0.08
  wheel_yaw_bias_max_mad: 0.015
  wheel_yaw_bias_noise_floor: 0.02
  wheel_yaw_bias_calibrate_offset: true
  wheel_yaw_rate_max_imu_difference: 0.10
  wheel_forward_innovation_gate: 0.0
  # ADIS16465 starts near 0.0029 rad/s on this sequence. This leaves room for
  # normal thermal drift while preventing a failed turn from creating the
  # 0.0043 rad/s bias norm observed in the previous full replay.
  max_gyro_bias: 0.0035
  max_acceleration_bias: 0.25

measurement_scheduler:
  # Offline evaluation must process the same measurement sequence regardless
  # of transient CPU load. The wall-clock scheduler drains any short backlog
  # after rosbag reaches the end instead of silently coalescing LiDAR frames.
  max_lidar_lag_sec: 0.0
  max_queue: 1000

visual_frontend:
  # A direct image update is useful only after its photometric solve converges.
  # Tight total correction bounds prevent timestamp/rolling-exposure error in a
  # turn from repeatedly rotating the LiDAR map through the shared ESKF state.
  require_convergence: true
  max_rotation_step_deg: 0.45
  max_translation_step: 0.06
  min_mean_ncc: 0.85
  observability_eigen_ratio: 0.002
