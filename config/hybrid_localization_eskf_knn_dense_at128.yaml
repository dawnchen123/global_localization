# Real-time dense KNN plane profile for AT128. It combines the two short-run
# improvements that were independently validated: local-sample planes and a
# denser, FAST-LIVO2-scale LiDAR information model.
lidar_odometry:
  scan_voxel_size: 0.24
  map_insert_voxel_size: 0.15
  max_scan_points: 9000

  use_point_knn_plane: true
  point_knn_fallback: false
  normal_neighbor_voxels: 1
  max_correspondence_distance: 0.80
  max_plane_distance: 0.22
  plane_fit_residual_gate: 0.10
  max_plane_neighbors: 20

  lidar_measurement_noise: 0.0316227766
  lidar_range_noise: 0.02
  lidar_beam_noise: 0.0008726646
  use_directional_lidar_covariance: true
  lidar_normalized_huber_delta: 2.5
  lidar_innovation_gate: 25.0
  wheel_forward_innovation_gate: 25.0
  covariance_reset_enabled: true
  freeze_mature_voxels: true
  map_insertion_min_translation: 0.20
  map_insertion_min_rotation_deg: 0.8
  map_insertion_max_interval: 0.50
